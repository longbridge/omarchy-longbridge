[package]
name = "longbridge-market-pulse-helper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "longbridge_market_pulse_helper"
path = "src/lib.rs"

[[bin]]
name = "longbridge-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "5.0"
hkdf = "0.12"
longbridge = { git = "https://github.com/longbridge/openapi.git", branch = "main" }
machine-uid = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-stream = "0.1"
tracing = "0.1"
time = "0.3"

[dev-dependencies]
rust_decimal = "1"
tempfile = "3"
