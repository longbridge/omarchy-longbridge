[package]
name = "longbridge-market-pulse-helper"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "longbridge_market_pulse_helper"
path = "src/lib.rs"

[[bin]]
name = "longbridge-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

